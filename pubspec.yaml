name: disciplinum
description: >-
  Disciplinum é um app de autocontrole e disciplina pessoal. Bloqueie apps que 
  te distraem, acompanhe seu progresso com medalhas e conquiste seus objetivos 
  em áreas como foco, dieta, finanças e mais. Interface premium com tema neon.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Ícones
  cupertino_icons: ^1.0.8
  
  # Notificações e Intents
  flutter_local_notifications: ^21.0.0 # Versão estável compatível
  android_intent_plus: ^6.0.0
  
  # Monitoramento de Uso e Apps

  installed_apps: ^2.1.1
  permission_handler: ^12.0.1
  
  # Armazenamento Local e Preferências
  shared_preferences: ^2.3.5
  path_provider: ^2.1.4
  
  # Banco de Dados ObjectBox (migrado de Isar)
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0
  path: ^1.8.3
  
  # Gerenciamento de Estado
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Utilitários
  equatable: ^2.0.5
  
  # Backend e Auth (Supabase + Google)
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  
  # Firebase (Core + Crashlytics)
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  
  # Utilitários de Device e UI
  device_info_plus: ^13.1.0
  image_picker: ^1.2.2
  package_info_plus: ^10.1.0
  shimmer: ^3.0.0
  
  # Anúncios (Versão atualizada!)
  google_mobile_ads: ^8.0.0
  
  # compras in-app
  in_app_purchase: ^3.0.0

  # Abrir URLs
  url_launcher: ^6.3.1
  in_app_review: ^2.0.9
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  table_calendar: ^3.2.0
  uuid: ^4.5.2
  fl_chart: ^1.2.0
  confetti: ^0.8.0
  
  # Background processing para notificações de conquistas
  workmanager: ^0.9.0+3
  
  # Logging profissional
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Geração de Assets
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  
  # Riverpod Code Generation
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.13
  
  # ObjectBox Code Generation
  objectbox_generator: ^4.1.0
  
  # Testes
  mockito: ^5.4.4
  fake_async: ^1.3.1
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/opening/disciplinado.png
    - assets/opening/warning1.png
    - assets/opening/warning2.png
    - assets/auth/
    - assets/icons/
    - assets/gamification/insignias/
    - assets/gamification/insignias/avoidAdultContent/
    - assets/gamification/insignias/bingeEating/
    - assets/gamification/insignias/diet/
    - assets/gamification/insignias/focus/
    - assets/gamification/insignias/moneySaving/
    - assets/gamification/insignias/procrastination/
    - assets/gamification/insignias/reading/
    - assets/gamification/insignias/smoking/
    - assets/gamification/insignias/spending/
    - assets/gamification/insignias/digitalDetox/
    - assets/gamification/medals/
    - assets/gamification/medals/avoidAdultContent/
    - assets/gamification/medals/bingeEating/
    - assets/gamification/medals/diet/
    - assets/gamification/medals/focus/
    - assets/gamification/medals/moneySaving/
    - assets/gamification/medals/procrastination/
    - assets/gamification/medals/reading/
    - assets/gamification/medals/smoking/
    - assets/gamification/medals/spending/
    - assets/gamification/medals/digitalDetox/
    - assets/gamification/others/
    - assets/secret_menu/
    - assets/modules/jejum_digital/
    - assets/modules/binge_eating/

# --- Configuração do Ícone do App ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23 # Atualizado conforme recomendação AdMob

# --- Configuração da Splash Screen ---
flutter_native_splash:
  color: "#000000"
  image: "assets/logo.png"
  android_gravity: center
  fullscreen: true
  
  android_12:
    image: "assets/logo.png"
    color: "#000000"
