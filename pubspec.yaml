name: disciplinum
description: >-
  Disciplinum é um app de autocontrole e disciplina pessoal. Bloqueie apps que 
  te distraem, acompanhe seu progresso com medalhas e conquiste seus objetivos 
  em áreas como foco, dieta, finanças e mais. Interface premium com tema neon.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Ícones
  cupertino_icons: ^1.0.8
  
  # Notificações e Intents
  flutter_local_notifications: ^19.5.0 # Versão estável compatível
  android_intent_plus: ^6.0.0
  
  # Monitoramento de Uso e Apps
  usage_stats: ^1.3.1
  installed_apps: ^2.0.0
  permission_handler: ^12.0.1
  
  # Armazenamento Local e Preferências
  shared_preferences: ^2.3.5
  path_provider_foundation: ^2.4.0
  
  # Gerenciamento de Estado
  provider: ^6.1.2
  
  # Backend e Auth (Supabase + Google)
  supabase_flutter: ^2.8.3
  supabase: ^2.5.0
  google_sign_in: ^7.2.0
  
  # Firebase (Core + Crashlytics)
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  
  # Utilitários de Device e UI
  device_info_plus: ^12.3.0
  image_picker: ^1.1.2
  package_info_plus: ^9.0.0
  shimmer: ^3.0.0
  
  # Anúncios (Versão atualizada!)
  google_mobile_ads: ^7.0.0
  
  # compras in-app
  in_app_purchase: ^3.0.0

  # Abrir URLs
  url_launcher: ^6.3.1
  in_app_review: ^2.0.9
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  timezone: ^0.10.1
  flutter_timezone: ^3.0.1
  table_calendar: ^3.2.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Geração de Assets
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/medal_bronze.png
    - assets/medal_silver.png
    - assets/medal_gold.png
    - assets/medal_diamond.png
    - assets/icons/
    - assets/disciplinado.png
    - assets/warning1.png
    - assets/warning2.png
    - assets/screenshots/
    - assets/Auth/
    - assets/secret_menu/

# --- Configuração do Ícone do App ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 23 # Atualizado conforme recomendação AdMob

# --- Configuração da Splash Screen ---
flutter_native_splash:
  color: "#000000"
  image: "assets/logo.png"
  android_gravity: center
  fullscreen: true
  
  android_12:
    image: "assets/logo.png"
    color: "#000000"
